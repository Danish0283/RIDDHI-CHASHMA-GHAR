<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RIDDHI CHASHMA GHAR | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="page-enter">
  <a href="#loginCard" class="skip-link">Skip to login</a>
  <main class="auth-page" id="loginCard">
    <section class="auth-card">
      <div class="auth-brand">
        <div class="logo-placeholder" aria-hidden="true">👓</div>
        <h1>RIDDHI CHASHMA GHAR</h1>
        <p>Secure offline optical shop management</p>
      </div>
      <form id="loginForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="email" id="username" name="username" placeholder="admin@riddhichashma" autocomplete="username" required aria-required="true" />
          <span class="field-error" id="usernameError" role="alert"></span>
        </div>
        <div class="form-group password-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required aria-required="true" />
            <button type="button" class="icon-button" id="togglePassword" aria-label="Toggle password visibility">👁️</button>
          </div>
          <span class="field-error" id="passwordError" role="alert"></span>
        </div>
        <div class="form-row spaced">
          <label class="checkbox-label"><input type="checkbox" id="rememberMe" /> Remember me</label>
          <button type="button" id="forgotPassword" class="link-button">Forgot password?</button>
        </div>
        <button type="submit" class="primary-btn" id="loginButton">
          <span class="button-text">Login</span>
          <span class="loader hidden" aria-hidden="true"></span>
        </button>
      </form>
      <p class="auth-footnote">Use admin@riddhichashma / riddhi@2024 to login.</p>
    </section>
  </main>
  <div id="toastContainer" aria-live="polite" aria-atomic="true"></div>
  <script src="js/utils.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="js/auth.js" defer></script>
</body>
</html>
